name: Problem
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste your bot token, API keys or cookies.txt here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you sent (link, file or folder), what happened, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: magpie-fi version
      description: Shown next to the name at the top of the web page, or the image tag you run.
      placeholder: "0.10.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Where it runs
      placeholder: "Synology NAS (amd64), Raspberry Pi 5 (arm64), VPS, ..."
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The lines around the problem from `docker compose logs magpie-fi`.
      render: text
