version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/core/frontend"
    schedule:
      interval: "monthly"
      time: "04:10"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    # typescript-eslint 8 requires TypeScript <6.1.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # yt-dlp breaks when YouTube changes, so the bot is checked weekly.
  - package-ecosystem: "uv"
    directory: "/bot"
    schedule:
      interval: "weekly"
      time: "04:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      youtube:
        patterns:
          - "yt-dlp*"
          - "ytmusicapi"
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:20"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/core"
      - "/bot"
    schedule:
      interval: "monthly"
      time: "04:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns:
          - "*"
