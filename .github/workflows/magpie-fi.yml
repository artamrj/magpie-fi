name: magpie-fi

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "scripts/docker-entrypoint.sh"
      - ".github/workflows/magpie-fi.yml"
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "scripts/docker-entrypoint.sh"
      - ".github/workflows/magpie-fi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magpie-fi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install media test tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi

      - name: Web page checks
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run build

      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked
