name: release

# Push a tag like v0.1.0 to publish ghcr.io/<owner>/magpie-fi with that version
# (tags: 0.1.0, v0.1.0, 0.1, 0, latest; linux/amd64 + linux/arm64).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to create, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/magpie-fi

jobs:
  image:
    name: Build ${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual release may create a tag that does not exist yet. Build the
          # exact commit selected in the workflow UI.
          ref: ${{ github.sha }}

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, for example v0.1.0"
            exit 1
          fi
          {
            echo "value=${RELEASE_TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}-${{ matrix.suffix }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ steps.version.outputs.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            APT_REFRESH=${{ steps.version.outputs.week }}
          # The build cache lives in the registry next to the image. GitHub's
          # own cache is capped at 10 GB and the test workflow's Rust caches
          # kept pushing these layers out, so every release built from zero.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.suffix }},mode=max,image-manifest=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true

      - name: Scan published architecture
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: v0.72.0
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}-${{ matrix.suffix }}
          format: table
          # Block on fixable CRITICAL/HIGH findings.
          exit-code: "1"
          # Block only on problems that have a fix: Debian lists many findings
          # that have no fixed package yet.
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, for example v0.1.0"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          {
            echo "tag=$RELEASE_TAG"
            echo "value=$version"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-architecture version tags
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$RELEASE_TAG" \
            --tag "$IMAGE:$MINOR" \
            --tag "$IMAGE:$MAJOR" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # The notes are this version's section of CHANGELOG.md, which
          # scripts/release.sh writes from the commit subjects.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "**Install:** \`docker pull $IMAGE:$VERSION\` (or set \`MAGPIE_TAG=$VERSION\` in \`.env\`)"
          } >> notes.md
          if grep -q '^- ' notes.md; then
            notes=(--notes-file notes.md)
          else
            # A tag pushed without scripts/release.sh: fall back to GitHub's list.
            notes=(--generate-notes)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "magpie-fi $VERSION" \
              "${notes[@]}"
          elif [[ "${notes[0]}" == --notes-file ]]; then
            # A re-run refreshes the notes instead of leaving old ones.
            gh release edit "$RELEASE_TAG" --title "magpie-fi $VERSION" --notes-file notes.md
          fi
