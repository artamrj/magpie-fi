# Navidrome settings for magpie-fi. Docs: https://www.navidrome.org/docs/usage/configuration/options/
# Paths are inside the container; compose.yaml maps them to MUSIC_ROOT/library and DATA_ROOT.

MusicFolder = "/music"
DataFolder = "/data"

# The core files songs into the library; the watcher sees them within seconds.
# The schedule is a safety net for NAS shares where the watcher may not fire.
Scanner.WatcherWait = "5s"
Scanner.Schedule = "@every 1h"
# Keep play counts and stars of files that moved. Clean up with `navidrome missing`.
Scanner.PurgeMissing = "never"

AutoImportPlaylists = true
PlaylistsPath = "Playlists"

LyricsPriority = ".ttml,.yaml,.yml,.elrc,.lrc,.srt,.txt,embedded"
CoverArtPriority = "cover.*, folder.*, front.*, embedded, external"
ArtistArtPriority = "artist.*, album/artist.*, external"

EnableSharing = true
Agents = "deezer,lastfm,listenbrainz"

# Anonymous usage statistics sent to the Navidrome project. Set to true to help them.
EnableInsightsCollector = false

# Daily backup of Navidrome's own database (users, play counts, stars, playlists).
Backup.Path = "/backup"
Backup.Schedule = "0 4 * * *"
Backup.Count = 14
