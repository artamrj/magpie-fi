<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      magpie-fi request card: a Bot API 10.4 widget. It has no network; it only
      draws the state the bot keeps in chat_data (see src/telegram/cards.rs for
      the keys), and its buttons send the bot's own button codes ("stop:12").
      Budget: 32 KB, and 4 KB after zlib -9 (web/scripts/check-widgets.mjs).
    -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font:
          15px/1.35 system-ui,
          sans-serif;
        color: #fff;
      }
      #k {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        padding: 14px;
        background: linear-gradient(
          135deg,
          var(--tg-theme-button-color),
          var(--tg-theme-accent-text-color)
        );
      }
      #k:before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.3);
      }
      #k > * {
        position: relative;
      }
      .h {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      #o {
        flex: none;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.2);
      }
      #c {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.4);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .done #o {
        animation: pop 0.6s;
      }
      .t {
        flex: 1;
        min-width: 0;
      }
      #y {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.8;
      }
      #n,
      #w {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #n {
        font-size: 17px;
        font-weight: 700;
      }
      #u,
      #w,
      #m,
      #d {
        font-size: 13px;
        opacity: 0.9;
      }
      .s,
      #g,
      #b {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }
      .s span {
        padding: 2px 9px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 13px;
      }
      #g {
        gap: 4px;
      }
      #g i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.25);
        transition:
          background 0.5s,
          transform 0.5s;
      }
      #g .n,
      #g .h {
        background: #fff;
      }
      #g .d,
      #g .i {
        background: rgba(255, 255, 255, 0.6);
        animation: p 1.2s ease-in-out infinite;
      }
      #g .r {
        background: #ffd54f;
      }
      #g .f {
        background: #ff8a80;
      }
      #g .x {
        opacity: 0.3;
      }
      #w,
      #m,
      #d {
        margin-top: 10px;
      }
      #b button {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 8px;
        font:
          600 14px system-ui,
          sans-serif;
        color: #fff;
        background: rgba(255, 255, 255, 0.22);
      }
      #b button:active {
        opacity: 0.6;
      }
      #b .stop {
        background: rgba(229, 57, 53, 0.85);
      }
      #d p {
        padding: 4px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }
      @keyframes p {
        50% {
          opacity: 0.35;
          transform: scale(0.8);
        }
      }
      @keyframes pop {
        50% {
          transform: scale(1.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #g i,
        #o {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="k">
      <div class="h">
        <div id="o"><div id="c">…</div></div>
        <div class="t">
          <div id="y"></div>
          <div id="n" dir="auto"></div>
          <div id="u" dir="auto"></div>
        </div>
      </div>
      <div class="s" id="s"></div>
      <div id="g"></div>
      <div id="w" dir="auto"></div>
      <div id="b"></div>
      <div id="m"></div>
      <div id="d" dir="auto"></div>
    </div>
    <script>
      var T = window.TelegramWidget,
        S = {},
        F = "";
      function $(i) {
        return document.getElementById(i);
      }
      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }
      var KIND = {
        track: "Song",
        album: "Album",
        playlist: "Playlist",
        upload: "Files",
      };
      var ICON = {
        w: "🕓",
        d: "⬇️",
        i: "🔎",
        r: "🤔",
        n: "✅",
        h: "✅",
        f: "⚠️",
        x: "🗑",
      };
      var BUTTON = {
        s: ["stop", "⏹ Stop"],
        r: ["retry", "🔁 Retry failed"],
        d: ["details", "ℹ️ Details"],
      };
      var ERROR = {
        NOT_ALLOWED: "Only the person who asked can do that.",
        RATE_LIMITED: "Too many taps. Wait a moment.",
        BUSY: "One moment…",
        TIMEOUT: "magpie-fi didn't answer. Try again.",
      };
      function draw() {
        var s = null;
        try {
          s = JSON.parse(T.chatData);
        } catch (e) {}
        if (!s || (s.v || 0) < (S.v || 0)) return;
        var was = S.s;
        S = s;
        var n = s.n || [0, 0, 0, 0, 0, 0],
          done = n[0],
          total = n[1],
          k = $("k");
        k.className = s.s;
        if (s.c)
          k.style.background = "linear-gradient(135deg," + s.c.join(",") + ")";
        $("y").textContent = KIND[s.k] || "";
        var line =
          s.s == "reading"
            ? "Reading the link…"
            : s.s == "failed"
              ? s.e || "Couldn't read this link."
              : s.s == "done"
                ? done == total
                  ? "All in your library"
                  : "Finished"
                : "Getting your music…";
        // Without a name yet, the status line becomes the title.
        $("n").textContent = s.t || line;
        $("u").textContent = s.t ? line : "";
        var p = total ? Math.round((done * 100) / total) : 0;
        $("o").style.background =
          "conic-gradient(#fff " + p + "%,rgba(255,255,255,.2) " + p + "%)";
        $("c").textContent =
          s.s == "reading"
            ? "…"
            : s.s == "failed"
              ? "!"
              : total > 1
                ? done + "/" + total
                : done
                  ? "✓"
                  : "…";
        var st = $("s");
        st.textContent = "";
        [
          [n[0], "✅", " in library"],
          [n[2], "⏳", " on the way"],
          [n[3], "🤔", " need you"],
          [n[4], "⚠️", " failed"],
        ].forEach(function (x) {
          if (total > 1 && x[0] > 0)
            st.appendChild(el("span", "", x[1] + " " + x[0] + x[2]));
        });
        var g = $("g"),
          songs = total > 1 ? s.g || "" : "";
        while (g.children.length > songs.length) g.removeChild(g.lastChild);
        for (var i = 0; i < songs.length; i++) {
          var dot = g.children[i] || g.appendChild(el("i"));
          dot.className = songs[i];
        }
        $("w").textContent = s.w
          ? (ICON[s.w[0]] || "") + " " + s.w.slice(1)
          : "";
        if (s.b != F) {
          F = s.b || "";
          var b = $("b");
          b.textContent = "";
          F.split("").forEach(function (f) {
            var x = BUTTON[f];
            if (!x) return;
            var button = el("button", x[0], x[1]);
            button.onclick = function () {
              ask(x[0]);
            };
            b.appendChild(button);
          });
        }
        if (was && was != "done" && s.s == "done") buzz("success");
      }
      function buzz(kind) {
        try {
          T.HapticFeedback.notificationOccurred(kind);
        } catch (e) {}
      }
      // Must run straight from the tap: Telegram allows one request per tap.
      function ask(action) {
        $("m").textContent = "…";
        T.request(action + ":" + S.id).then(
          function (answer) {
            var a = null;
            try {
              a = JSON.parse(answer.result);
            } catch (e) {}
            $("m").textContent = (a && a.m) || "";
            var d = $("d");
            d.textContent = "";
            ((a && a.d) || []).forEach(function (row) {
              var line = el("p");
              line.appendChild(el("b", "", row[0]));
              line.appendChild(document.createTextNode(" · " + row[1]));
              d.appendChild(line);
            });
          },
          function (error) {
            $("m").textContent =
              ERROR[error.code] || "That didn't work. Try again.";
            buzz("error");
          },
        );
      }
      if (T) {
        T.onEvent("chatDataChanged", draw);
        draw();
        if (T.ready) T.ready();
      }
    </script>
  </body>
</html>
