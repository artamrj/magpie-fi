# magpie-fi
#
#   links (web page, Telegram) ─► magpie downloads ─┐
#   your drops ─► MUSIC_ROOT/inbox ─────────────────┼─► magpie ─► MUSIC_ROOT/library ─► navidrome ─► your apps
#   files sent to the Telegram bot ─────────────────┘
#
# magpie identifies every new song, files it into the library (BLUEPRINT.md §5)
# and moves originals to MUSIC_ROOT/.magpie/trash.
# Settings: .env (see .env.example). Setup: README.md.

name: magpie-fi

services:
  magpie:
    build: .
    image: ghcr.io/artamrj/magpie-fi:${MAGPIE_TAG:-latest}
    restart: unless-stopped
    # Web page (Get music, Review, status), published on loopback only. To open it
    # from your phone or inside Telegram, give it an HTTPS address (README:
    # "Phone and Telegram Mini App"); with Telegram set up it then needs a login.
    ports:
      - "${MAGPIE_PORT:-7331}:7331"
    # Settings come from .env (see .env.example). Empty means "off" or default.
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      RUST_LOG: "${RUST_LOG:-info}"
      # Paths inside the container; the host paths are set by the volumes below.
      MAGPIE_MUSIC_ROOT: /music
      MAGPIE_DATA_DIR: /data
      MAGPIE_INBOX_CHECK_SECONDS: "${MAGPIE_INBOX_CHECK_SECONDS:-}"
      MAGPIE_INBOX_SETTLE_SECONDS: "${MAGPIE_INBOX_SETTLE_SECONDS:-}"
      MAGPIE_TRASH_DAYS: "${MAGPIE_TRASH_DAYS:-}"
      MAGPIE_LYRICS: "${MAGPIE_LYRICS:-}"
      MAGPIE_AUDIO_FORMAT: "${MAGPIE_AUDIO_FORMAT:-}"
      MAGPIE_MAX_PARALLEL_DOWNLOADS: "${MAGPIE_MAX_PARALLEL_DOWNLOADS:-}"
      MAGPIE_DOWNLOAD_PAUSE_SECONDS: "${MAGPIE_DOWNLOAD_PAUSE_SECONDS:-}"
      MAGPIE_MAX_COLLECTION_TRACKS: "${MAGPIE_MAX_COLLECTION_TRACKS:-}"
      # Used only when config/ytdlp/cookies.txt exists.
      MAGPIE_YTDLP_COOKIES: /config/cookies.txt
      MAGPIE_TELEGRAM_BOT_TOKEN: "${MAGPIE_TELEGRAM_BOT_TOKEN:-}"
      MAGPIE_TELEGRAM_OWNERS: "${MAGPIE_TELEGRAM_OWNERS:-}"
      MAGPIE_PUBLIC_URL: "${MAGPIE_PUBLIC_URL:-}"
      MAGPIE_ACOUSTID_KEY: "${MAGPIE_ACOUSTID_KEY:-}"
      MAGPIE_AUDD_TOKEN: "${MAGPIE_AUDD_TOKEN:-}"
      MAGPIE_SPOTIFY_CLIENT_ID: "${MAGPIE_SPOTIFY_CLIENT_ID:-}"
      MAGPIE_SPOTIFY_CLIENT_SECRET: "${MAGPIE_SPOTIFY_CLIENT_SECRET:-}"
      MAGPIE_SOUNDCLOUD_CLIENT_ID: "${MAGPIE_SOUNDCLOUD_CLIENT_ID:-}"
      MAGPIE_SOUNDCLOUD_CLIENT_SECRET: "${MAGPIE_SOUNDCLOUD_CLIENT_SECRET:-}"
      MAGPIE_YOUTUBE_API_KEY: "${MAGPIE_YOUTUBE_API_KEY:-}"
      MAGPIE_DISCOGS_TOKEN: "${MAGPIE_DISCOGS_TOKEN:-}"
      MAGPIE_LASTFM_KEY: "${MAGPIE_LASTFM_KEY:-}"
      MAGPIE_THEAUDIODB_KEY: "${MAGPIE_THEAUDIODB_KEY:-}"
    volumes:
      # The whole music root as ONE mount, so moves between inbox, library and
      # trash are instant renames.
      - ${MUSIC_ROOT:-./music}:/music
      - ${DATA_ROOT:-./data}/magpie:/data
      - ./config/ytdlp:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 45s
