# magpie-fi
#
#   your drops, the bot ─► MUSIC_ROOT/inbox ─► magpie ─► MUSIC_ROOT/library ─► navidrome ─► your apps
#
# magpie identifies every new song in the inbox, files it into the library
# (BLUEPRINT.md §5) and moves the original to MUSIC_ROOT/.magpie/trash.
# Settings: .env (see .env.example). Setup: README.md.

name: magpie-fi

services:
  magpie:
    build: .
    image: ghcr.io/artamrj/magpie-fi:${MAGPIE_TAG:-latest}
    restart: unless-stopped
    # Web page (review, status). Keep it on loopback: it has no login yet.
    # From another computer: ssh -L 7331:127.0.0.1:7331 <server>
    ports:
      - "127.0.0.1:${MAGPIE_PORT:-7331}:7331"
    # Settings come from .env (see .env.example). Empty means "off" or default.
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      RUST_LOG: "${RUST_LOG:-info}"
      # Paths inside the container; the host paths are set by the volumes below.
      MAGPIE_MUSIC_ROOT: /music
      MAGPIE_DATA_DIR: /data
      MAGPIE_NAVIDROME_URL: "${MAGPIE_NAVIDROME_URL:-http://navidrome:4533}"
      MAGPIE_NAVIDROME_USER: "${MAGPIE_NAVIDROME_USER:-}"
      MAGPIE_NAVIDROME_PASSWORD: "${MAGPIE_NAVIDROME_PASSWORD:-}"
      MAGPIE_INBOX_CHECK_SECONDS: "${MAGPIE_INBOX_CHECK_SECONDS:-}"
      MAGPIE_INBOX_SETTLE_SECONDS: "${MAGPIE_INBOX_SETTLE_SECONDS:-}"
      MAGPIE_TRASH_DAYS: "${MAGPIE_TRASH_DAYS:-}"
      MAGPIE_LYRICS: "${MAGPIE_LYRICS:-}"
      MAGPIE_AUDIO_FORMAT: "${MAGPIE_AUDIO_FORMAT:-}"
      MAGPIE_MAX_PARALLEL_DOWNLOADS: "${MAGPIE_MAX_PARALLEL_DOWNLOADS:-}"
      MAGPIE_DOWNLOAD_PAUSE_SECONDS: "${MAGPIE_DOWNLOAD_PAUSE_SECONDS:-}"
      MAGPIE_MAX_COLLECTION_TRACKS: "${MAGPIE_MAX_COLLECTION_TRACKS:-}"
      # Used only when config/ytdlp/cookies.txt exists.
      MAGPIE_YTDLP_COOKIES: /config/cookies.txt
      MAGPIE_ACOUSTID_KEY: "${MAGPIE_ACOUSTID_KEY:-}"
      MAGPIE_AUDD_TOKEN: "${MAGPIE_AUDD_TOKEN:-}"
      MAGPIE_SPOTIFY_CLIENT_ID: "${MAGPIE_SPOTIFY_CLIENT_ID:-}"
      MAGPIE_SPOTIFY_CLIENT_SECRET: "${MAGPIE_SPOTIFY_CLIENT_SECRET:-}"
      MAGPIE_SOUNDCLOUD_CLIENT_ID: "${MAGPIE_SOUNDCLOUD_CLIENT_ID:-}"
      MAGPIE_SOUNDCLOUD_CLIENT_SECRET: "${MAGPIE_SOUNDCLOUD_CLIENT_SECRET:-}"
      MAGPIE_YOUTUBE_API_KEY: "${MAGPIE_YOUTUBE_API_KEY:-}"
      MAGPIE_DISCOGS_TOKEN: "${MAGPIE_DISCOGS_TOKEN:-}"
      MAGPIE_LASTFM_KEY: "${MAGPIE_LASTFM_KEY:-}"
      MAGPIE_THEAUDIODB_KEY: "${MAGPIE_THEAUDIODB_KEY:-}"
    volumes:
      # The whole music root as ONE mount, so moves between inbox, library and
      # trash are instant renames.
      - ${MUSIC_ROOT:-./music}:/music
      - ${DATA_ROOT:-./data}/magpie:/data
      - ./config/ytdlp:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    stop_grace_period: 45s

  navidrome:
    image: ghcr.io/navidrome/navidrome:${NAVIDROME_TAG:-0.64.2}
    restart: unless-stopped
    # Navidrome runs directly as the host user. If your NAS rejects `user:`,
    # remove this line; Navidrome then runs as its image default (uid 1000).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_CONFIGFILE: /config/navidrome.toml
    volumes:
      - ${MUSIC_ROOT:-./music}/library:/music:ro
      - ${DATA_ROOT:-./data}/navidrome:/data
      - ${DATA_ROOT:-./data}/navidrome-backup:/backup
      - ./config/navidrome.toml:/config/navidrome.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4533/ping"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Temporary Telegram bridge (BLUEPRINT.md §8): the old Python bot drops its
  # downloads into the inbox until Telegram moves into magpie (Phase 3).
  # Links pasted into magpie's own web page do not need it.
  # Start it with: docker compose --profile bot up -d
  bot:
    profiles: [bot]
    build: ./bot
    image: ghcr.io/artamrj/magpie-fi-bot:${MAGPIE_TAG:-latest}
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      ALLOWED_TELEGRAM_USER_IDS: "${ALLOWED_TELEGRAM_USER_IDS:-}"
      # The bot's "music folder" is the inbox. Its temp folder sits inside the same
      # mount so finished files appear with one rename; magpie skips dot-folders.
      MUSIC_DIR: /music
      DOWNLOAD_TMP_DIR: /music/.incoming
      DATA_DIR: /data
      AUDIO_FORMAT: "${MAGPIE_AUDIO_FORMAT:-m4a}"
      METADATA_LOOKUP: "true"
      # magpie fetches lyrics when it files the song.
      LYRICS: "false"
      MAX_PARALLEL_DOWNLOADS: "${MAGPIE_MAX_PARALLEL_DOWNLOADS:-2}"
      DOWNLOAD_PAUSE_SECONDS: "${MAGPIE_DOWNLOAD_PAUSE_SECONDS:-3}"
      MAX_COLLECTION_TRACKS: "${MAGPIE_MAX_COLLECTION_TRACKS:-1000}"
      YTDLP_COOKIES_FILE: "${YTDLP_COOKIES_FILE:-}"
      RECEIVED_STICKER_ID: "${RECEIVED_STICKER_ID:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ${MUSIC_ROOT:-./music}/inbox:/music
      - ${DATA_ROOT:-./data}/bot:/data
      - ./config/ytdlp:/config:ro
